<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KARTIKA-CDS: Split-View Dual Enclave Observer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F8F7;
      --bar-bg: #FFFFFF;
      --border: #E2E8F0;
      --text: #1E293B;
      --muted: #475569;
      --accent: #059669;
      --accent-soft: #ECFDF5;
      --accent-border: #A7F3D0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { 
      height: 100%; 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      font-size: 13px; 
    }
    
    .observer-bar {
      height: 48px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
      z-index: 50;
      position: relative;
    }
    .observer-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .observer-shield-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .observer-left strong {
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .observer-left span {
      font-weight: 600;
      color: var(--text);
    }
    .observer-right {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .observer-right strong {
      color: #065F46;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .observer-right strong::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
    }
    .columns-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100% - 48px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-right: 1px solid var(--border);
      background: var(--bg);
    }
    iframe:last-child {
      border-right: none;
    }
    @media (max-width: 900px) {
      .columns-container {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      iframe {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <div class="observer-bar">
    <div class="observer-left">
      <div class="observer-shield-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
      <span><strong>KARTIKA-CDS:</strong> Out-of-Band Observer (Sisi Luar &amp; Sisi Dalam Terisolasi)</span>
    </div>
    <div class="observer-right">
      <span>Jalur Balik Server:</span>
      <strong>0 Byte (Simplex UDP + Host Bridge L2 Drop)</strong>
    </div>
  </div>

  <div class="columns-container">
    <iframe id="low" title="Sisi Luar - Dropzone Gate"></iframe>
    <iframe id="high" title="Sisi Dalam - High-Side OT Enclave"></iframe>
  </div>

  <script src="split.js"></script>
</body>
</html>
