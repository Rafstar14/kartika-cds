<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KARTIKA-CDS: Split-View Dual Enclave Observer</title>
  <style>
    :root {
      --bg: #070B0E;
      --bar-bg: #0E1720;
      --border: #1C2E3D;
      --text: #E6EDF3;
      --muted: #8B9EA8;
      --accent: #00E676;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; }
    
    .observer-bar {
      height: 44px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .observer-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .observer-left strong {
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .observer-right {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .observer-right strong {
      color: #FFFFFF;
      background: rgba(0, 230, 118, 0.12);
      border: 1px solid rgba(0, 230, 118, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .columns-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100% - 44px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-right: 1px solid var(--border);
      background: var(--bg);
    }
    iframe:last-child {
      border-right: none;
    }
    @media (max-width: 900px) {
      .columns-container {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
      iframe {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <div class="observer-bar">
    <div class="observer-left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
      <span><strong>KARTIKA-CDS:</strong> Out-of-Band Observer (Sisi Luar &amp; Sisi Dalam Terisolasi)</span>
    </div>
    <div class="observer-right">
      <span>Jalur Balik Server:</span>
      <strong>0 Byte (Simplex UDP + Host Bridge L2 Drop)</strong>
    </div>
  </div>

  <div class="columns-container">
    <iframe id="low" title="Sisi Luar - Dropzone Gate"></iframe>
    <iframe id="high" title="Sisi Dalam - High-Side OT Enclave"></iframe>
  </div>

  <script src="split.js"></script>
</body>
</html>
